# ==============================================================================
# AyuCTMS — Container Runtime Server Environment (No Nginx)
# ==============================================================================
# Architecture:
#   - Frontend (React SPA / Vite Preview on Node): EXPOSED to Host (Port 5173)
#   - Backend (FastAPI / Uvicorn):                 INTERNAL ONLY (Port 8000 on private network)
#   - Database (PostgreSQL 16):                    INTERNAL ONLY (Port 5432 on private network)
#
# Frontend proxies /api requests internally to Backend over Docker's network.
# No Nginx used — pure Node.js + Python stack.
#
# Usage:
#   docker compose up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web Application (Exposed to Host / Outside)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ayuctms-frontend
    restart: unless-stopped
    # ONLY Frontend is exposed to the outside (defaults to 5173, configurable via FRONTEND_PORT)
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Backend Server API (Internal Only — NOT exposed to Host/Internet)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ayuctms-backend
    restart: unless-stopped
    # No "ports" mapping! Port 8000 is accessible ONLY inside the Docker network.
    expose:
      - "8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WORKERS=2
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ayuctms
      - SECRET_KEY=ayu-ctms-production-grade-jwt-secret-key-32bytes-secure
      - APP_BASE_URL=http://localhost:5173
      - SEED_ON_STARTUP=false
    volumes:
      - ctms_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL Database (Internal Only — NOT exposed to Host/Internet)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ayuctms-db
    restart: unless-stopped
    # No "ports" mapping! Database is strictly isolated within Docker network.
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ayuctms
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ayuctms"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  ctms_data:
    name: ayuctms_data
  pg_data:
    name: ayuctms_pgdata
